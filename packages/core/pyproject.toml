[project]
name = "core"
version = "0.1.0"
description = "Shared schemas, utilities, and database models"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "nba-api>=1.4.1",
    "diskcache>=5.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
