[project]
name = "draft-optimizer"
version = "0.1.0"
description = "Fantasy basketball draft optimizer with ML projections and LP roster selection"
requires-python = ">=3.11"
dependencies = [
    "core",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pulp>=2.7.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.10.0",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draft_optimizer"]
