services:
  db:
    image: postgres:16-alpine
    container_name: sports_hub_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sports_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sports_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: sports_hub_mlflow
    ports:
      - "5001:5000"  # 5000 is used by macOS AirPlay
    command: >
      mlflow server
      --host 0.0.0.0
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root ./mlflow/artifacts
    volumes:
      - ../../mlflow:/mlflow
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
